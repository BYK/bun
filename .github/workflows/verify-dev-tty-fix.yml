# Investigation workflow: determine WHERE the Darwin /dev/tty keystroke
# delivery bug reproduces. Users on their desktop Macs report the bug
# with Bun 1.3.11 (via sentry-cli's compiled binary). Initial run
# against stock 1.3.13 on macos-14 (ARM64) did NOT reproduce. Matrix
# below varies Bun version and runner OS to isolate the variable.
#
# For each matrix cell the harness exit code is reported as-is (no
# inversion). A PASSING step ("got:590a") means the bug is NOT present.
# A FAILING step (timeout, no "got:") means the bug IS reproducing.
name: TTY bug repro matrix

on:
  push:
    branches:
      - byk/darwin-dev-tty-fast-path
  workflow_dispatch:

jobs:
  repro-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13]
        bun: ["1.3.11", "1.3.12", "1.3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    name: "bun ${{ matrix.bun }} on ${{ matrix.os }}"
    steps:
      - name: Install Bun ${{ matrix.bun }}
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${{ matrix.bun }}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Confirm Bun version + runner details
        run: |
          bun --version
          echo "---"
          sw_vers
          echo "---"
          uname -a

      - name: Run the PTY harness (reports bug status)
        shell: bash
        run: |
          set +e
          python3 <<'PY'
          import os, pty, sys, select, time, subprocess

          BUN = subprocess.run(
              ["bash", "-c", "command -v bun"],
              capture_output=True, text=True, check=True
          ).stdout.strip()

          os.makedirs("/tmp/repro", exist_ok=True)
          with open("/tmp/repro/child.js", "w") as f:
              f.write(
                  'process.stdout.write("ready\\n");\n'
                  'process.stdin.setRawMode(true);\n'
                  'process.stdin.on("data", chunk => {\n'
                  '  process.stdout.write("got:" + chunk.toString("hex") + "\\n");\n'
                  '  process.exit(0);\n'
                  '});\n'
              )

          pid, master_fd = pty.fork()
          if pid == 0:
              r, w = os.pipe()
              os.dup2(r, 0); os.close(r); os.close(w)
              os.execvp("bash", ["bash", "-c", f'exec "{BUN}" /tmp/repro/child.js </dev/tty'])

          deadline = time.monotonic() + 4.0
          saw_ready = False; output = b""; wrote_input = False
          while time.monotonic() < deadline:
              r, _, _ = select.select([master_fd], [], [], max(0.0, deadline - time.monotonic()))
              if master_fd in r:
                  try: chunk = os.read(master_fd, 4096)
                  except OSError: break
                  if not chunk: break
                  output += chunk
                  if not saw_ready and b"ready" in output:
                      saw_ready = True
                  if saw_ready and not wrote_input:
                      os.write(master_fd, b"Y\n")
                      wrote_input = True
                  if b"got:" in output:
                      break

          try: os.kill(pid, 9)
          except OSError: pass
          try: os.waitpid(pid, 0)
          except OSError: pass

          sys.stdout.buffer.write(output); sys.stdout.flush()
          sys.exit(0 if b"got:" in output else 1)
          PY
          harness_exit=$?
          set -e

          echo "---"
          echo "Harness exit code: $harness_exit"
          if [ "$harness_exit" -eq 0 ]; then
            echo "✓ Bug NOT reproducing on this matrix cell (keystroke delivered)"
          else
            echo "✗ Bug IS reproducing on this matrix cell (harness timed out)"
          fi
          # Pass the exit code through so the step's status reflects the
          # bug state: green = no bug, red = bug.
          exit "$harness_exit"
