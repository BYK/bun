# Build a patched Bun for darwin-arm64 and use it to build sentry-cli
# so we can hand the resulting binary to macOS users for real-world
# validation of the /dev/tty fast-path fix.
#
# Workflow artifact at the end: `sentry-darwin-arm64` — a drop-in
# replacement for the sentry binary that ships via install.sh, but
# embedding our patched Bun runtime.
#
# Estimated runtime: 45-75 minutes (first run, no ccache warm-up).
name: Build sentry-cli with patched Bun (darwin-arm64)

on:
  push:
    branches:
      - byk/darwin-dev-tty-fast-path
  workflow_dispatch:

jobs:
  build-sentry-with-patched-bun:
    name: Build patched Bun + sentry-cli for darwin-arm64
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout patched Bun (this fork)
        uses: actions/checkout@v4
        with:
          path: bun

      - name: Verify the patch is present
        run: |
          if ! grep -q "Darwin fast-path: when \`fd\` is our controlling terminal" bun/src/bun.js/bindings/c-bindings.cpp; then
            echo "::error::The patch marker is missing from c-bindings.cpp."
            exit 1
          fi
          echo "✓ Patch present"

      - name: Install Bun build dependencies (Homebrew)
        run: |
          brew install automake ccache cmake coreutils gnu-sed go icu4c libiconv libtool ninja pkg-config rust ruby llvm@21

      - name: Put LLVM 21 on PATH
        run: |
          echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"

      - name: Install a stable Bun to drive the build
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install Bun's own deps
        working-directory: bun
        run: bun install --frozen-lockfile

      - name: Cache Bun build (ccache + deps)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            bun/build/debug/deps
            bun/build/release/deps
            bun/vendor
          key: bun-build-macos-14-${{ hashFiles('bun/CMakeLists.txt', 'bun/package.json', 'bun/scripts/download-zig.ts', 'bun/scripts/update-submodules.sh') }}

      - name: Build Bun (release)
        working-directory: bun
        run: |
          bun run build:release
        env:
          CCACHE_DIR: ~/.cache/ccache

      - name: Locate patched Bun binary
        id: locate-bun
        run: |
          for candidate in bun/build/release/bun bun/build/debug/bun-debug; do
            if [ -x "$candidate" ]; then
              path="$(realpath "$candidate")"
              echo "bun=$path" >> "$GITHUB_OUTPUT"
              echo "✓ Found patched Bun at $path"
              "$path" --version
              "$path" --revision || true
              break
            fi
          done
          if [ -z "$(grep '^bun=' "$GITHUB_OUTPUT")" ]; then
            echo "::error::No Bun binary found after build"
            ls -la bun/build/ 2>&1 || true
            exit 1
          fi

      # Sanity check: run the regression test against the patched binary
      # to confirm the fix works before we embed it in sentry-cli.
      - name: Sanity-check the patched Bun against the PTY repro
        env:
          PATCHED_BUN: ${{ steps.locate-bun.outputs.bun }}
        run: |
          set +e
          python3 <<'PY'
          import os, pty, sys, select, time

          BUN = os.environ["PATCHED_BUN"]
          os.makedirs("/tmp/repro", exist_ok=True)
          with open("/tmp/repro/child.js", "w") as f:
              f.write(
                  'process.stdout.write("ready\\n");\n'
                  'process.stdin.setRawMode(true);\n'
                  'process.stdin.on("data", chunk => {\n'
                  '  process.stdout.write("got:" + chunk.toString("hex") + "\\n");\n'
                  '  process.exit(0);\n'
                  '});\n'
              )

          pid, master_fd = pty.fork()
          if pid == 0:
              r, w = os.pipe()
              os.dup2(r, 0); os.close(r); os.close(w)
              os.execvp("bash", ["bash", "-c", f'exec "{BUN}" /tmp/repro/child.js </dev/tty'])

          deadline = time.monotonic() + 4.0
          saw_ready = False; output = b""; wrote_input = False
          while time.monotonic() < deadline:
              r, _, _ = select.select([master_fd], [], [], max(0.0, deadline - time.monotonic()))
              if master_fd in r:
                  try: chunk = os.read(master_fd, 4096)
                  except OSError: break
                  if not chunk: break
                  output += chunk
                  if not saw_ready and b"ready" in output:
                      saw_ready = True
                  if saw_ready and not wrote_input:
                      os.write(master_fd, b"Y\n")
                      wrote_input = True
                  if b"got:" in output:
                      break
          try: os.kill(pid, 9)
          except OSError: pass
          try: os.waitpid(pid, 0)
          except OSError: pass
          sys.stdout.buffer.write(output); sys.stdout.flush()
          sys.exit(0 if b"got:" in output else 1)
          PY
          rc=$?
          set -e
          # This is informational — on macos-14 runners even stock Bun
          # delivers keystrokes, so we don't expect this to change
          # status. Still useful to log for the PR body.
          echo "PTY harness exit code with patched Bun: $rc"

      - name: Checkout sentry-cli at the commit BEFORE the macOS workaround was restored
        uses: actions/checkout@v4
        with:
          repository: getsentry/cli
          path: sentry-cli
          # a38572ecf1d0e1c2b5f8be01e16eb1d767f3ddff is PR #835 (workaround
          # deleted). Using this commit means the resulting binary has NO
          # userland /dev/tty workaround — the only thing fixing the
          # keystroke delivery would be the patched Bun runtime. Clean
          # A/B test.
          ref: a38572ecf1d0e1c2b5f8be01e16eb1d767f3ddff
          fetch-depth: 0

      - name: Patch sentry-cli build script to use the patched Bun runtime
        working-directory: sentry-cli
        env:
          PATCHED_BUN: ${{ steps.locate-bun.outputs.bun }}
        run: |
          # Sentry-cli's build script passes an explicit
          # `compile.target = "bun-darwin-arm64"` to `Bun.build`, which
          # normally triggers a download from npm instead of using the
          # running Bun as the embed runtime. We drop the `target` field
          # so the build falls into the `isDefault()` branch and uses
          # `selfExePath()` — our patched Bun.
          #
          # This only works when the host Bun's target matches the desired
          # output (both darwin-arm64 in this workflow), which is exactly
          # our setup.
          python3 - <<'PY'
          import re
          p = "script/build.ts"
          src = open(p).read()
          # Replace the entire compile block's target assignment.
          patched = re.sub(
              r"(compile:\s*\{\s*)target:\s*getBunTarget\(target\)\s+as\s+[^,]+,\s*",
              r"\1// target: <omitted>  — use selfExePath (patched Bun) as embed runtime\n        ",
              src,
              count=1,
          )
          if patched == src:
              raise SystemExit("failed to patch build.ts — compile.target block not found")
          open(p, "w").write(patched)
          print("✓ Patched sentry-cli/script/build.ts")
          PY
          grep -n "compile:" script/build.ts || true

      - name: Install sentry-cli deps using the patched Bun
        working-directory: sentry-cli
        env:
          PATCHED_BUN: ${{ steps.locate-bun.outputs.bun }}
        run: |
          "$PATCHED_BUN" install --frozen-lockfile

      - name: Build sentry-cli for darwin-arm64 using the patched Bun
        working-directory: sentry-cli
        env:
          PATCHED_BUN: ${{ steps.locate-bun.outputs.bun }}
        run: |
          # sentry-cli's package.json uses `"build"` (not `build:single`)
          # to invoke the single-target build via `script/build.ts --single`.
          "$PATCHED_BUN" run build
          ls -la dist-bin/
          file dist-bin/sentry-darwin-arm64

      - name: Quick smoke test — `sentry --version` with the embedded patched Bun
        working-directory: sentry-cli
        run: |
          ./dist-bin/sentry-darwin-arm64 --version

      - name: Upload sentry-darwin-arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentry-darwin-arm64-patched-bun
          path: sentry-cli/dist-bin/sentry-darwin-arm64
          retention-days: 14

      - name: Leave install instructions in the summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## How to use this build

          1. Download `sentry-darwin-arm64-patched-bun` from the workflow
             artifacts (top of the run page, "Artifacts" section).
          2. Unzip and make it executable:
             ```bash
             unzip sentry-darwin-arm64-patched-bun.zip
             chmod +x sentry-darwin-arm64
             ```
          3. Run `sentry init` the same way you would the real release
             (e.g., from a project directory). If the wizard's first
             prompt — "EXPERIMENTAL: This feature is experimental and may
             modify your code. Continue?" — accepts your keystrokes
             (Y/N/Enter), the patch worked. If it hangs like before, the
             patch isn't the right fix.

          The binary is sentry-cli from `main` (includes the
          userland /dev/tty workaround), built with a Bun runtime that
          includes the Candidate A patch from this PR. If the userland
          workaround is what's actually fixing your macOS install, the
          Bun patch underneath is redundant; if the userland workaround
          isn't sufficient and the Bun patch is what unblocks you, we
          have clear signal to push the upstream PR.
          MD
